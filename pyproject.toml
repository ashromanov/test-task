[project]
name = "async-payments"
version = "1.0.0"
description = "Asynchronous payments with transactional outbox and durable RabbitMQ retries"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "sqlalchemy[asyncio]==2.1.3",
  "faststream[rabbit]==0.7.7",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "uvicorn==0.54.0",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "aiohttp==3.14.4",
]

[dependency-groups]
dev = ["httpx==0.28.1", "ruff>=0.15"]
load = [
    "locust==2.46.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
