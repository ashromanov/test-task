name: async-payments

x-app: &app
  image: ${APP_IMAGE:-async-payments:local}
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  environment: &environment
    API_KEY: ${API_KEY:?Set API_KEY in .env (at least 16 characters)}
    DATABASE_URL: postgresql+asyncpg://payments:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/
    DEMO_MODE: ${DEMO_MODE:-false}
    CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-16}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
    OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.25}
    WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-5}
    WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.6-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2 +A 4
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    <<: *app
    build: .
    command: [sh, -c, "alembic upgrade head && exec uvicorn payments.api:app --host 0.0.0.0 --port 8000 --loop uvloop --limit-concurrency 64 --no-access-log"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health',headers={'X-API-Key':os.environ['API_KEY']}),timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  consumer:
    <<: *app
    pull_policy: never
    command: [python, -m, payments.worker]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
